# Tests and builds Vault Sync for Windows, macOS and Linux. Every push to main is published as a GitHub release
# with the next version number (1.0.0, 1.0.1, ...; see version.py). Pull requests and manual runs build test
# versions (e.g. 1.0.1-dev+abc1234) that are uploaded as workflow artifacts only.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs on main wait for each other instead of running side by side, so each release sees the tag of the one
# before it and gets the next number. Older runs of a pull request are cancelled by newer pushes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags, to count the releases

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            release=true; version=$(python version.py --release)
          else
            release=false; version=$(python version.py)
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Vault Sync $version (release: $release)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: VaultSync-windows-x64
          - os: macos-latest
            artifact: VaultSync-macos-arm64
          # The oldest supported Ubuntu, so the binary also runs on distributions with an older glibc.
          - os: ubuntu-22.04
            artifact: VaultSync-linux-x64
    runs-on: ${{ matrix.os }}
    env:
      VAULT_SYNC_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Tk and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk xvfb

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m unittest discover -t . -s tests -v

      - name: Build
        run: python build.py

      - name: Smoke test
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) app="dist/Vault Sync.exe" ;;
            macOS)   app="dist/Vault Sync.app/Contents/MacOS/Vault Sync" ;;
            Linux)   app="dist/vault-sync" ;;
          esac
          # The build carries the version of this run.
          "$app" --version | tee version.txt
          test "$(tr -d '\r' < version.txt)" = "$VAULT_SYNC_VERSION"
          # The bundled gogrepoc and its dependencies load.
          "$app" --gogrepoc -h | tee gogrepoc-help.txt
          grep -q "usage" gogrepoc-help.txt
          # The window opens and keeps running until it is stopped (exit code 124 = stopped by timeout).
          if [ "$RUNNER_OS" = Linux ]; then
            export VAULT_SYNC_HOME="$RUNNER_TEMP/vault-sync-home"
            status=0; timeout 15 xvfb-run -a "$app" || status=$?
            test "$status" -eq 124
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          name="${{ matrix.artifact }}-$VAULT_SYNC_VERSION"
          name="${name//+/_}"  # "+" is awkward in download URLs
          case "$RUNNER_OS" in
            Windows) 7z a "out/$name.zip" "./dist/Vault Sync.exe" ;;
            macOS)   ditto -c -k --keepParent "dist/Vault Sync.app" "out/$name.zip" ;;
            Linux)   tar -czf "out/$name.tar.gz" -C dist vault-sync ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # Creates the tag v<version> on the commit that was built, and the release with the three builds.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Vault Sync ${{ needs.version.outputs.version }}
          files: out/*
          generate_release_notes: true
