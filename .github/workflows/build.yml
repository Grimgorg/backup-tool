# Tests and builds Vault Sync for Windows, macOS and Linux. Every push to main is published as a GitHub release
# with the next version number (2.0.0, 2.0.1, ...; see version.py). Pull requests and manual runs build test
# versions (e.g. 2.0.1-dev+abc1234) that are uploaded as workflow artifacts only; a manual run on main with
# "release" ticked publishes a release like a push does (for when a push did not start the workflow).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish this run as a release (only on main)
        type: boolean
        default: false

permissions:
  contents: read

# Runs on main wait for each other instead of running side by side, so each release sees the tag of the one
# before it and gets the next number. Older runs of a pull request are cancelled by newer pushes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags, to count the releases

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref }}" = refs/heads/main ] && \
             { [ "${{ github.event_name }}" = push ] || [ "${{ inputs.release }}" = true ]; }; then
            release=true; version=$(python version.py --release)
          else
            release=false; version=$(python version.py)
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Vault Sync $version (release: $release)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The release file names are what the updater looks for (vaultsync/updater.py, asset_prefix).
          - os: windows-latest
            artifact: vault-sync-windows-x64
          - os: macos-latest
            artifact: vault-sync-macos-arm64
          # The oldest supported Ubuntu, so the binary also runs on distributions with an older glibc.
          - os: ubuntu-22.04
            artifact: vault-sync-linux-x64
    runs-on: ${{ matrix.os }}
    env:
      VAULT_SYNC_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m unittest discover -t . -s tests -v

      - name: Build
        run: python build.py

      - name: Smoke test
        shell: bash
        run: |
          app=dist/vault-sync
          [ "$RUNNER_OS" = Windows ] && app=dist/vault-sync.exe
          # Keeps the smoke test's data out of dist/ (the build keeps its data next to itself).
          export VAULT_SYNC_HOME="$RUNNER_TEMP/vault-sync-home"
          # The build carries the version of this run.
          "$app" --version | tee version.txt
          test "$(tr -d '\r' < version.txt)" = "$VAULT_SYNC_VERSION"
          # The build verifies HTTPS certificates (update check, downloads); see use_bundled_certificates().
          "$app" --check-https | tee https.txt
          grep -q "HTTPS ok" https.txt
          # The bundled gogrepoc and its dependencies load.
          "$app" --gogrepoc -h | tee gogrepoc-help.txt
          grep -q "usage" gogrepoc-help.txt
          # The console app (Textual, bundled lazily-imported modules) starts and shows its tabs.
          "$app" --check-tui | tee tui.txt
          grep -q "TUI ok" tui.txt
          test ! -e dist/vault-sync-data

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          name="${{ matrix.artifact }}-$VAULT_SYNC_VERSION"
          name="${name//+/_}"  # "+" is awkward in download URLs
          # One file each; tar keeps the executable bit on macOS and Linux.
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "out/$name.zip" ./dist/vault-sync.exe
          else
            tar -czf "out/$name.tar.gz" -C dist vault-sync
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # Creates the tag v<version> on the commit that was built, and the release with the three builds.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Vault Sync ${{ needs.version.outputs.version }}
          files: out/*
          generate_release_notes: true
